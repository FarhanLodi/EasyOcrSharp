name: Feature request
description: Suggest a capability or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem you are solving, not the solution you have in mind. It often changes the answer.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: If you have an API shape in mind, sketch it.
      render: csharp

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Existing options that came close, and where they fell short.

  - type: checkboxes
    id: breaking
    attributes:
      label: Compatibility
      options:
        - label: This would change existing public API or behaviour
